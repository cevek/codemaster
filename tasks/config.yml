version: 1
id:
  prefix: t
  length: 6
  alphabet: digits # base32 (default) | alpha (a-z) | hex (0-9a-f) | digits (0-9)
statuses:
  - name: backlog
    actionable: true
  - name: todo
    actionable: true
  - name: in-progress
  - name: review
  - name: done
    terminal: true
  - name: rejected
    terminal: true
priorities: [ low, medium, high, urgent ]
defaults:
  status: backlog
  priority: low
maxDepth: 3
archive:
  mode: manual
# Fields mirror the backlog's own taxonomy: `type · imp · cx` + the subsystem section.
fields:
  # work class — the first tag token in the old `- [ ]` items
  type: { type: enum, values: [ bug, feat, perf, dx, infra, doc, imp ] }
  # cx — S (hours) · M (a PR) · L (a fat task / design needed); declared ascending
  complexity: { type: enum, values: [ S, M, L ] }
  # subsystem — the section the item lived under in docs/backlog.md
  area:
    type: enum
    values:
      - platform
      - multi-program
      - ts-core
      - ts-refactor
      - transaction
      - impact-usages
      - framework
      - render
      - trace
      - scss
      - i18n
      - schema
      - docs
      - correctness
  source:
    type: enum
    values:
      - dogfood-jul
      - dogfood-inbox-aug
    required: false
  relates:
    type: reflist
  surface:
    type: list
  audience:
    type: enum
    values:
      - internal
      - external
      - both
  # The ordering axis of the work queue (CONTRIBUTING "Backlog discipline"). Records the
  # OBSERVED ACT, never the importance — `measured` needs a number, `repro` needs a command
  # that reproduces on current main. That is what makes it the one field an inflation wave
  # cannot reach. Do not add a value that no check stands behind: `field-report` was such a
  # value and ended up on zero tasks.
  evidence:
    type: enum
    values:
      - measured
      - repro
      - reported
      - unverified
  author:
    type: string
    required: new
    icon: user-pen
  assignee:
    type: string
    icon: user-check
web:
  host: 127.0.0.1
  port: 57345
